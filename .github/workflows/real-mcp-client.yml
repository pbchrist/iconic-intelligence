name: ICONIC external MCP interoperability and registry publication
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/test-real-mcp-client.py'
      - 'scripts/check-agent-distribution.py'
      - '.github/workflows/real-mcp-client.yml'
  schedule:
    - cron: '43 7 * * *'
permissions:
  contents: read
jobs:
  real-client:
    name: External MCP client, execution and safe checkout preparation
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned official MCP Python client
        run: python -m pip install 'mcp==2.3.0'
      - name: Exercise independent MCP client and real non-chargeable capabilities
        run: python scripts/test-real-mcp-client.py

  registry-publication:
    name: Official MCP Registry exact listings and endpoint parity
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Verify both published server identities, latest status, and remote URLs
        run: python3 scripts/check-agent-distribution.py --output distribution-evidence.json
      - name: Preserve audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: distribution-evidence
          path: distribution-evidence.json
          if-no-files-found: warn
          retention-days: 30

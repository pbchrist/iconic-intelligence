# Publish iconic.onl from a sanitized gh-pages branch.
name: Publish iconic.onl
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: iconic-pages-sync
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Collect public site files
        run: |
          mkdir -p "$RUNNER_TEMP/iconic-public"
          rsync -a --exclude '.git' --exclude '.github' --exclude '_site' \
            --exclude 'README.md' --exclude 'CHANGELOG.md' --exclude 'PLAN.md' --exclude 'server.js' \
            --exclude 'package.json' --exclude '.gitignore' --exclude '*.patch' ./ "$RUNNER_TEMP/iconic-public/"
          printf 'iconic.onl\n' > "$RUNNER_TEMP/iconic-public/CNAME"
          touch "$RUNNER_TEMP/iconic-public/.nojekyll"
      - name: Update publishing branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout gh-pages
          rsync -a --delete --exclude '.git' "$RUNNER_TEMP/iconic-public/" ./
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Publish site from ${GITHUB_SHA}"
            git push origin gh-pages
          fi
